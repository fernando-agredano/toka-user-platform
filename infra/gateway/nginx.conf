worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS; lets the frontend upstream resolve lazily (it may not be running yet).
  resolver 127.0.0.11 valid=10s ipv6=off;

  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
  limit_req_status 429;

  # Reuse the caller's correlation id, otherwise mint one from the request id.
  map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
  }

  upstream auth_service  { server auth-service:3001; }
  upstream user_service  { server user-service:3002; }
  upstream role_service  { server role-service:3003; }
  upstream audit_service { server audit-service:3004; }
  upstream ai_agent_service { server ai-agent-service:3005; }
  upstream mcp_server { server mcp-server:3006; }

  server {
    listen 8080;
    server_tokens off;

    limit_req zone=per_ip burst=40 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-correlation-id $correlation_id;
    add_header x-correlation-id $correlation_id always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Service-to-service endpoints are never reachable from outside. Regex locations win over prefixes.
    location ~ ^/api/[^/]+/internal(/|$) {
      return 404;
    }

    location /api/auth/  { proxy_pass http://auth_service; }
    location /api/users  { proxy_pass http://user_service; }
    location /api/roles  { proxy_pass http://role_service; }
    location /api/audit  { proxy_pass http://audit_service; }
    # The agent may spend up to ~25s on one answer (retries, tool calls), so give it more room than the default 60s margin.
    location /api/ai/    { proxy_pass http://ai_agent_service; proxy_read_timeout 90s; }

    # MCP over Streamable HTTP: responses can be SSE streams, so nothing may be buffered. The Authorization header is forwarded untouched.
    location /mcp {
      proxy_pass http://mcp_server;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 120s;
    }

    # Unknown API paths must 404 instead of falling through to the SPA's index.html.
    location /api/ {
      return 404;
    }

    # SPA served by the frontend container (phase 6). A variable makes nginx resolve it per request.
    location / {
      set $frontend http://frontend:8080;
      proxy_pass $frontend;
    }
  }
}
