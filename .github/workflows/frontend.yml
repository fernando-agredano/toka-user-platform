name: Frontend CI

on:
  push:
    branches: [master, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

# The frontend is not an npm workspace, so it installs from its own lockfile.
defaults:
  run:
    working-directory: ./frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check tests
        run: npm run typecheck:test

      - name: Tests
        run: npm test
        env:
          CI: "true"

      - name: Build
        run: npm run build
